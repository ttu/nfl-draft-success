<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fonts are self-hosted. Loading them from fonts.googleapis.com used to put a
      render-blocking stylesheet on the critical path and a three-hop chain
      (document → googleapis CSS → gstatic woff2) in front of first paint. These
      are the same variable-font files Google served, so the byte cost is
      unchanged; only the hops are gone.

      Preload + @font-face live together here, both built from %BASE_URL%, so the
      two URLs are identical under any base and the preloaded response is
      actually reused rather than fetched twice. Only the `latin` subsets are
      preloaded — `latin-ext` is declared below and fetched on demand for the
      occasional accented name.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="%BASE_URL%fonts/space-grotesk-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="%BASE_URL%fonts/geist-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="%BASE_URL%fonts/jetbrains-mono-latin.woff2"
    />
    <style>
      /* Each family ships as one variable file spanning 400–700, so a single
         face covers every weight the design system asks for. */
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('%BASE_URL%fonts/space-grotesk-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('%BASE_URL%fonts/space-grotesk-latin-ext.woff2')
          format('woff2');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('%BASE_URL%fonts/geist-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('%BASE_URL%fonts/geist-latin-ext.woff2') format('woff2');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('%BASE_URL%fonts/jetbrains-mono-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('%BASE_URL%fonts/jetbrains-mono-latin-ext.woff2')
          format('woff2');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <!--
      The rankings page paints from these before any draft class loads, so they
      start with the document rather than after the bundle has parsed and
      mounted. Draft classes are deliberately absent: they are range-dependent
      and far larger, and preloading them would recreate the contention.
    -->
    <link
      rel="preload"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/default-rankings.json"
    />
    <link
      rel="preload"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/data-meta.json"
    />
    <!--
      Every draft class. The app needs all nine soon after load, and a deep link
      to any year range must find its classes here. `prefetch` rather than
      `preload` on purpose: the browser fetches these at Lowest priority once the
      critical work is done, which is exactly the scheduling this needs — no
      hand-rolled idle queue. Default range first, then outward from it, since
      document order sets dispatch order within a priority band.
      Update this list when YEAR_MIN/YEAR_MAX in src/App.tsx move.
    -->
    <link
      rel="prefetch"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/draft-2021.json"
    />
    <link
      rel="prefetch"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/draft-2022.json"
    />
    <link
      rel="prefetch"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/draft-2023.json"
    />
    <link
      rel="prefetch"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/draft-2024.json"
    />
    <link
      rel="prefetch"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/draft-2025.json"
    />
    <link
      rel="prefetch"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/draft-2026.json"
    />
    <link
      rel="prefetch"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/draft-2020.json"
    />
    <link
      rel="prefetch"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/draft-2019.json"
    />
    <link
      rel="prefetch"
      as="fetch"
      crossorigin
      href="%BASE_URL%data/draft-2018.json"
    />
    <meta
      name="description"
      content="Compare NFL draft outcomes for all 32 teams. Pick a season span and explore snap share, retention, and rolling scores—by team, draft year, or position."
    />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="canonical" href="https://www.nfldraftsuccess.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nfldraftsuccess.com/" />
    <meta property="og:title" content="NFL Draft Success" />
    <meta
      property="og:description"
      content="Compare NFL draft outcomes for all 32 teams. Pick a season span and explore snap share, retention, and rolling scores—by team, draft year, or position."
    />
    <!--
      `?v=2` is deliberate. LinkedIn caches a scrape per image URL, and the
      first version of this card was an RGBA PNG its image proxy refused,
      leaving the thumbnail blank; the query makes it fetch the flattened PNG
      as a new asset instead of replaying that cached failure.
    -->
    <meta
      property="og:image"
      content="https://www.nfldraftsuccess.com/og-image.png?v=2"
    />
    <meta
      property="og:image:secure_url"
      content="https://www.nfldraftsuccess.com/og-image.png?v=2"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="See how each NFL team's draft picks perform"
    />
    <meta property="og:site_name" content="NFL Draft Success" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.nfldraftsuccess.com/" />
    <meta name="twitter:title" content="NFL Draft Success" />
    <meta
      name="twitter:description"
      content="Compare NFL draft outcomes for all 32 teams. Pick a season span and explore snap share, retention, and rolling scores—by team, draft year, or position."
    />
    <meta
      name="twitter:image"
      content="https://www.nfldraftsuccess.com/og-image.png?v=2"
    />
    <meta
      name="twitter:image:alt"
      content="See how each NFL team's draft picks perform"
    />

    <title>NFL Draft Success</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
